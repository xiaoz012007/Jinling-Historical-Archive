<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img"><title>日军南京方向任务示意（分时段叙述，非同日地图）</title><rect width="100%" height="100%" fill="#f7f4ec"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2933}.title{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#505e67}.name{font-size:18px;font-weight:600}.small{font-size:13px;fill:#505e67}</style><text x="32" y="43" class="title" font-size="26" font-family="Noto Sans CJK SC">日军南京方向任务示意（分时段叙述，非同日地图）</text><text x="32" y="75" class="sub" font-size="15" font-family="Noto Sans CJK SC">无地理坐标、无比例尺；只呈现编译所述方向，不把命令、到达、交战和占领合成一层。</text><rect x="32" y="112" width="1216" height="91" rx="7" fill="white" stroke="#d3dadb"/><text x="50" y="141" class="name" font-size="18" font-family="Noto Sans CJK SC">第9师团</text><text x="274" y="141" class="name" font-size="18" font-family="Noto Sans CJK SC">金坛—淳化镇；准备光华门/中山门/太平门方向</text><text x="50" y="167" class="small" font-size="13" font-family="Noto Sans CJK SC">JP-M01 · SRC-0022 · 非空文本段74</text><text x="274" y="177" class="sub" font-size="15" font-family="Noto Sans CJK SC">计划方向；没有采用各城门实际到达时刻</text><rect x="32" y="216" width="1216" height="91" rx="7" fill="white" stroke="#d3dadb"/><text x="50" y="245" class="name" font-size="18" font-family="Noto Sans CJK SC">第16师团</text><text x="274" y="245" class="name" font-size="18" font-family="Noto Sans CJK SC">句容—汤山—马群；准备中央门两侧方向</text><text x="50" y="271" class="small" font-size="13" font-family="Noto Sans CJK SC">JP-M02 · SRC-0022 · 非空文本段79</text><text x="274" y="281" class="sub" font-size="15" font-family="Noto Sans CJK SC">仅取任务方向；该段41师/句容叙述待核</text><rect x="32" y="320" width="1216" height="91" rx="7" fill="white" stroke="#d3dadb"/><text x="50" y="349" class="name" font-size="18" font-family="Noto Sans CJK SC">第13师团主力</text><text x="274" y="349" class="name" font-size="18" font-family="Noto Sans CJK SC">镇江渡江—仪征—六合—滁县方向</text><text x="50" y="375" class="small" font-size="13" font-family="Noto Sans CJK SC">JP-M03 · SRC-0022 · 非空文本段78</text><text x="274" y="385" class="sub" font-size="15" font-family="Noto Sans CJK SC">主力与抽出的山田支队分开；不绘同时占领面</text><rect x="32" y="424" width="1216" height="91" rx="7" fill="white" stroke="#d3dadb"/><text x="50" y="453" class="name" font-size="18" font-family="Noto Sans CJK SC">第114师团</text><text x="274" y="453" class="name" font-size="18" font-family="Noto Sans CJK SC">溧阳—溧水—秣陵关；准备中华门方向</text><text x="50" y="479" class="small" font-size="13" font-family="Noto Sans CJK SC">JP-M04 · SRC-0022 · 非空文本段81</text><text x="274" y="489" class="sub" font-size="15" font-family="Noto Sans CJK SC">编译任务，非已核逐日轨迹</text><rect x="32" y="528" width="1216" height="91" rx="7" fill="white" stroke="#d3dadb"/><text x="50" y="557" class="name" font-size="18" font-family="Noto Sans CJK SC">第6师团</text><text x="274" y="557" class="name" font-size="18" font-family="Noto Sans CJK SC">随114师团南进；中华门及以西诸门方向</text><text x="50" y="583" class="small" font-size="13" font-family="Noto Sans CJK SC">JP-M05 · SRC-0022 · 非空文本段83</text><text x="274" y="593" class="sub" font-size="15" font-family="Noto Sans CJK SC">部署项不等于所有师团部队同日抵城</text><rect x="32" y="632" width="1216" height="91" rx="7" fill="white" stroke="#d3dadb"/><text x="50" y="661" class="name" font-size="18" font-family="Noto Sans CJK SC">第18师团</text><text x="274" y="661" class="name" font-size="18" font-family="Noto Sans CJK SC">原拟南京方向；改为宁国—宣城—芜湖</text><text x="50" y="687" class="small" font-size="13" font-family="Noto Sans CJK SC">JP-M06 · SRC-0022 · 非空文本段85–86</text><text x="274" y="697" class="sub" font-size="15" font-family="Noto Sans CJK SC">外围截断任务；不画南京城垣攻城箭头</text><rect x="32" y="736" width="1216" height="91" rx="7" fill="white" stroke="#d3dadb"/><text x="50" y="765" class="name" font-size="18" font-family="Noto Sans CJK SC">国崎支队</text><text x="274" y="765" class="name" font-size="18" font-family="Noto Sans CJK SC">当涂渡江—江北—浦口迂回方向</text><text x="50" y="791" class="small" font-size="13" font-family="Noto Sans CJK SC">JP-M07 · SRC-0022 · 非空文本段87</text><text x="274" y="801" class="sub" font-size="15" font-family="Noto Sans CJK SC">母部队、临时任务和到达/占领时间须分别核</text><text x="32" y="879" class="sub" font-size="15" font-family="Noto Sans CJK SC">与中方12月8日夜命令图不能叠成“当晚双方实际部署”：两图资料时点与证据层级不同。</text><text x="32" y="917" class="small" font-size="13" font-family="Noto Sans CJK SC">计划不是完成；现代地名不自动等同1937阵地。正式军事地图仍需日方原图、地名定位证据和合法底图。</text></svg>